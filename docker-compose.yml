# Single-host deployment: nginx is the only published port, so the frontend and
# the API share one origin and no CORS configuration is needed.
#
# There is no database service. The database is SQLite — a file, not a server —
# so it lives in the `dbdata` named volume mounted at /srv/data, which is where
# the backend's default DATABASE_URL already points.

services:
  backend:
    build: ./backend
    image: fireflies-backend:prod
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////srv/data/app.db
      SEED_ON_STARTUP: "true"
      # Empty: same-origin behind nginx means there is no cross-origin request.
      CORS_ORIGINS: "[]"
    env_file:
      # Supplies LLM_API_KEY. Create it on the server from backend/.env.example;
      # it is gitignored and must never be committed. Marked optional so a fresh
      # clone comes up without it — but note the degradation is silent: /api/query
      # falls back to keyword retrieval with no error. If the AI answers look
      # shallow, this file is the first thing to check.
      - path: ./backend/.env
        required: false
    volumes:
      - dbdata:/srv/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time, not runtime: NEXT_PUBLIC_* is inlined into the browser
        # bundle by `next build`. Changing this requires a rebuild, not a restart.
        NEXT_PUBLIC_API_BASE: /api
    image: fireflies-frontend:prod
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dbdata:
