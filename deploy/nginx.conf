server {
    listen 80;
    server_name _;

    # Uploaded transcripts are capped at 5MB by the API; give a little headroom
    # so an oversized file is rejected by the app with a clean 422 rather than
    # by nginx with an opaque 413.
    client_max_body_size 8m;

    # Everything the browser needs lives on this one origin: the page and the
    # API alike. That is why the app sets NEXT_PUBLIC_API_BASE=/api and why the
    # backend's CORS allowlist stays empty in production — there is no
    # cross-origin request to allow.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # an LLM-backed /api/query can be slow
    }

    # FastAPI's interactive reference. A reviewer will look for this.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Next dev/HMR websockets; harmless in production.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
