# Deployment compose for the EC2 host. Deliberately has no `build:` sections:
# a t3.micro has 1GB of RAM and `next build` will OOM on it. Images are built on
# a workstation and shipped with `docker save | ssh docker load`, so this file
# only ever runs them.
#
# There is no database service. SQLite is a file, so the database is the
# `dbdata` volume mounted where the backend's default DATABASE_URL points.

services:
  backend:
    image: fireflies-backend:prod
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////srv/data/app.db
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: "[]"   # same-origin behind nginx; nothing to allow
    env_file:
      - path: ./.env
        required: false
    volumes:
      - dbdata:/srv/data
    expose:
      - "8000"

  frontend:
    image: fireflies-frontend:prod
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dbdata:
